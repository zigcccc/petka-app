packages:
  - '**'

allowBuilds:
  '@sentry/cli': true
  esbuild: true
  msgpackr-extract: true

ignoredBuiltDependencies:
  - unrs-resolver

minimumReleaseAgeExclude:
  - '@expo/cli@57.0.16'
  - '@expo/config@57.0.8'
  - '@expo/fingerprint@0.20.8'
  - '@expo/inline-modules@0.1.6'
  - '@expo/log-box@57.0.3'
  - expo-asset@57.0.12
  - expo-constants@57.0.12
  - expo@57.0.14
  - '@expo/metro-runtime@57.0.11'
  - expo-build-properties@57.0.12
  - expo-dev-client@57.0.13
  - expo-dev-launcher@57.0.13
  - expo-dev-menu@57.0.13
  - expo-notifications@57.0.12
  - expo-router@57.0.14
  - expo-splash-screen@57.0.7
  - expo-updates@57.0.15
  - '@biomejs/biome@2.5.9'
  - '@biomejs/cli-darwin-arm64@2.5.9'
  - '@biomejs/cli-darwin-x64@2.5.9'
  - '@biomejs/cli-linux-arm64-musl@2.5.9'
  - '@biomejs/cli-linux-arm64@2.5.9'
  - '@biomejs/cli-linux-x64-musl@2.5.9'
  - '@biomejs/cli-linux-x64@2.5.9'
  - '@biomejs/cli-win32-arm64@2.5.9'
  - '@biomejs/cli-win32-x64@2.5.9'
  - '@hookform/resolvers@5.9.1'
  - dayjs@1.11.23

nodeLinker: hoisted

onlyBuiltDependencies:
  - '@sentry/cli'
  - esbuild
  - posthog-react-native
  - react-native-mmkv
  - react-native-nitro-modules
  - dtrace-provider
