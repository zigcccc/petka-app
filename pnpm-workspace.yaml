packages:
  - '**'

allowBuilds:
  '@parcel/watcher': false
  '@sentry/cli': true
  esbuild: true
  msgpackr-extract: true
  unrs-resolver: false

ignoredBuiltDependencies:
  - unrs-resolver

minimumReleaseAgeExclude:
  - lucide-react-native@1.38.0

nodeLinker: hoisted

onlyBuiltDependencies:
  - '@sentry/cli'
  - esbuild
  - posthog-react-native
  - react-native-mmkv
  - react-native-nitro-modules
  - dtrace-provider
